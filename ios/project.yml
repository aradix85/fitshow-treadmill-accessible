name: Loopband
options:
  bundleIdPrefix: nl.aradix
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Loopband:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.aradix.loopband
        PRODUCT_NAME: Loopband
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Loopband
        # Without this iOS assumes the app is English and VoiceOver reads the
        # labels with an English voice, even though every string is Dutch.
        CFBundleDevelopmentRegion: nl
        CFBundleLocalizations:
          - nl
        UILaunchScreen: {}
        UIBackgroundModes:
          - bluetooth-central
          - audio
        NSBluetoothAlwaysUsageDescription: >-
          Om rechtstreeks verbinding te maken met je loopband.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
